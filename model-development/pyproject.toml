[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightning-model-lab"
version = "0.1.0"
description = "Independent dataset, training, evaluation, and ONNX release pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<6",
]

[project.optional-dependencies]
train = [
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
lightning-model = "lightning_model_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lightning_model_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
