[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightning-strike-extractor"
version = "0.3.0"
description = "Detect and export the best lightning strikes from videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
detector = [
  "onnxruntime>=1.20,<2",
]

[project.scripts]
lse = "lightning_extractor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lightning_extractor"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy/prototypes"]
